version: 2
updates:
  - package-ecosystem: npm
    directory: /
    ignore:
      # 1.65.x crashes Firefox content processes during axe scans
      # (microsoft/playwright#43967, Mozilla bug 2090055). Allow again once a
      # release with the fix ships (> 1.65.x).
      - dependency-name: '@playwright/test'
        versions: ['1.65.x']
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase # keeps exact pins exact
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories: ['/server', '/dashboard']
    schedule:
      interval: weekly
      day: monday
