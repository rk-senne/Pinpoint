version: 2
updates:
  - package-ecosystem: npm
    directory: /
    ignore:
      # 1.65.x crashes Firefox content processes during axe scans
      # (microsoft/playwright#43967, Mozilla bug 2090055). Allow again once a
      # release with the fix ships (> 1.65.x).
      - dependency-name: '@playwright/test'
        versions: ['1.65.x']
      - dependency-name: 'playwright-core'
        versions: ['1.65.x']
      # ESLint 10 drops .eslintrc and eslint-plugin-import has no ESLint 10
      # support yet; needs a flat-config migration (tracked separately).
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (native compiler) is outside typescript-eslint's supported
      # range (<6.1); revisit when typescript-eslint supports it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase # keeps exact pins exact
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      # These must move together (coverage-v8 pins vitest exactly; vitest/crxjs peer on vite).
      vite-vitest:
        patterns: ['vite', 'vitest', '@vitest/*']
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories: ['/server', '/dashboard']
    schedule:
      interval: weekly
      day: monday
