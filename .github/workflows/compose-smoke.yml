# Boots both Compose stacks for real (dev: docker-compose.yml, prod:
# deploy/docker-compose.prod.yml behind Caddy) and asserts they serve traffic.
# See infrastructure/scripts/compose-smoke.sh and docs/DEPLOYMENT.md.
name: compose-smoke

on:
  # No path filter: these are required checks on main, and a filtered-out
  # required check would never report and block the PR.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: compose-smoke (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tool versions
        run: |
          docker version
          docker compose version
          jq --version
          openssl version

      - name: Compose smoke (${{ matrix.mode }})
        env:
          SMOKE_LOG_DIR: ${{ runner.temp }}/compose-smoke-logs
        run: bash infrastructure/scripts/compose-smoke.sh "${{ matrix.mode }}"

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-smoke-logs-${{ matrix.mode }}
          path: ${{ runner.temp }}/compose-smoke-logs
          if-no-files-found: ignore
          retention-days: 7
