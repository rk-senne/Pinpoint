name: Security

# Free, open-source security scanning (CONTRIBUTING.md). Runs on every PR (so
# its jobs can be required checks), on main, and weekly for new advisories.
#
# Supply-chain notes:
# - Trivy runs from a pinned release verified with its Sigstore bundle, NOT
#   aquasecurity/trivy-action: that action's tags were hijacked in March 2026
#   (GHSA-69fq-xp46-6x23).
# - gitleaks runs from the MIT-licensed release binary (checksum-pinned): the
#   gitleaks GitHub Action needs a license key for organization repos.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRIVY_VERSION: 0.76.2
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
  OSV_VERSION: 2.7.1
  OSV_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
  SEMGREP_VERSION: 1.187.0
  COSIGN_SHA256: 46dbdcb5467a3dfec2526923d0b3365e40c8d9dc00ec23d5aca3437449e8cbfd # v3.0.2 cosign-linux-amd64

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:javascript-typescript

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep CE (OSS rules)
        env:
          SEMGREP_SEND_METRICS: 'off'
        # Official image pinned by digest (a hash-pinned install, unlike a bare pip install).
        run: |
          docker run --rm -e SEMGREP_SEND_METRICS=off -v "$PWD:/src" -w /src \
            "semgrep/semgrep:${SEMGREP_VERSION}@sha256:0c8dfa7aa1ca8c50233ec9110e8cd88d139dedd603d56507493f74c6f4b3e062" \
            semgrep scan --metrics=off --error \
            --config p/javascript --config p/typescript --config p/nodejs \
            --config p/expressjs --config p/owasp-top-ten --config p/secrets \
            server/src dashboard/src widget/src extension/src shared/src mcp-server/src scripts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history
      - name: gitleaks (full git history)
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 .

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: npm audit (all dependencies)
        run: npm audit --audit-level=moderate
      - name: OSV-Scanner
        run: |
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=package-lock.json

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Trivy (checksum + Sigstore verified)
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "$base/$asset"
          curl -fsSLO "$base/$asset.sigstore.json"
          echo "${TRIVY_SHA256}  $asset" | sha256sum -c -
          curl -fsSL -o cosign https://github.com/sigstore/cosign/releases/download/v3.0.2/cosign-linux-amd64
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          chmod +x cosign
          ./cosign verify-blob "$asset" --bundle "$asset.sigstore.json" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\.com/aquasecurity/trivy/\.github/workflows/.+@refs/tags/v${TRIVY_VERSION//./\\.}$"
          tar -xzf "$asset" trivy
          sudo mv trivy /usr/local/bin/trivy
      - name: Filesystem (vulnerabilities, secrets, IaC misconfig)
        run: >-
          trivy fs --quiet --scanners vuln,secret,misconfig --severity HIGH,CRITICAL
          --skip-dirs node_modules --exit-code 1 .
      - name: Container images
        run: |
          docker build -q -t pinpoint-server:scan -f server/Dockerfile .
          docker build -q -t pinpoint-dashboard:scan -f dashboard/Dockerfile .
          for img in pinpoint-server:scan pinpoint-dashboard:scan; do
            trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$img"
          done

  zap-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Boot the production stack and run the OWASP ZAP baseline scan
        run: bash infrastructure/scripts/zap-baseline.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zap-report
          path: zap-report/
          if-no-files-found: ignore

  scorecard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: scorecard.sarif
