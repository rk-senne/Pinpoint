<!-- Loaded on demand with the page module (see lib/lazyTemplates.ts). -->
    <!--
      Public legal pages (`/legal`, `/legal/:doc`) — Terms, Privacy Policy, Cookie Policy,
      Sub-processors, DPA, AUP, Retention, Breach response. Rendered by
      `dashboard/src/pages/LegalPage.ts` from the bundled docs/legal/*.md. No
      authentication, no cookies, no API calls.
    -->
    <template id="tpl-legal-page">
      <div data-role="legal-root" style="min-height: 100vh; background: var(--pp-bg-page); color: var(--pp-text-primary); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
        <header style="display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--pp-border); background: var(--pp-bg-primary);">
          <a href="/" data-route style="font-weight: 600; color: inherit; text-decoration: none; font-size: 16px;">Pinpoint</a>
          <nav data-slot="nav" aria-label="Legal documents" style="display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px;"></nav>
        </header>
        <main id="main-content" style="max-width: 820px; margin: 0 auto; padding: 24px 20px 64px;">
          <p data-slot="draft-banner" role="note" hidden style="margin: 0 0 16px; padding: 8px 12px; border: 1px solid var(--pp-border-medium); border-radius: 4px; background: var(--pp-bg-secondary); font-size: 13px;"></p>
          <article data-slot="content" class="legal-content" style="line-height: 1.6; font-size: 15px;"></article>
        </main>
      </div>
    </template>
