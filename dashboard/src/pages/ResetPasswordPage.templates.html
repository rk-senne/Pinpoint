<!-- Loaded on demand with the page module (see lib/lazyTemplates.ts). -->
<!--
  Password reset (`/reset-password` requests a link, `/reset-password/:token`
  sets the new password). Wired in `dashboard/src/pages/ResetPasswordPage.ts`.
-->
<template id="tpl-reset-password">
  <div
    class="fl-reset-password"
    style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--pp-bg-page);"
  >
    <form
      data-action="submit:submit"
      novalidate
      style="background: var(--pp-bg-primary); padding: 32px; border-radius: 8px; width: 360px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);"
    >
      <h1 data-slot="title" style="margin: 0 0 8px; font-size: 24px; text-align: center;"></h1>
      <p data-slot="hint" style="margin: 0 0 20px; font-size: 14px; color: var(--pp-text-secondary); text-align: center;"></p>
      <div
        data-slot="message"
        role="status"
        hidden
        style="padding: 8px 12px; border-radius: 4px; margin-bottom: 16px; font-size: 14px;"
      ></div>

      <div data-slot="emailField" style="margin-bottom: 20px;">
        <label for="fl-reset-email" style="display: block; margin-bottom: 4px; font-size: 14px;">Email</label>
        <input
          id="fl-reset-email"
          name="email"
          type="email"
          autocomplete="email"
          style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--pp-input-border); box-sizing: border-box;"
        />
      </div>

      <div data-slot="passwordField" hidden style="margin-bottom: 20px;">
        <label for="fl-reset-password" style="display: block; margin-bottom: 4px; font-size: 14px;">New password</label>
        <input
          id="fl-reset-password"
          name="password"
          type="password"
          autocomplete="new-password"
          style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--pp-input-border); box-sizing: border-box;"
        />
      </div>

      <button
        type="submit"
        data-slot="submitBtn"
        style="width: 100%; padding: 10px; border-radius: 4px; border: none; background: var(--pp-accent); color: #fff; font-size: 16px; cursor: pointer;"
      ></button>

      <p style="text-align: center; margin-top: 16px; font-size: 14px;">
        <a href="/login" data-route style="color: var(--pp-link-alt);">Back to log in</a>
      </p>
    </form>
  </div>
</template>
