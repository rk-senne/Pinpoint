<!-- Loaded on demand with the page module (see lib/lazyTemplates.ts). -->
    <!--
      ReviewLinkPage shell (Mission C1). Frames the server-side proxy at
      `/review/:linkId` inside a sandboxed iframe with a sidebar. Wired in
      `dashboard/src/pages/ReviewLinkPage.ts`.
    -->
    <template id="tpl-review-link-page">
      <div
        data-fl-review-root
        class="pp-review-root"
        style="display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;"
      >
        <aside
          class="pp-review-aside"
          style="width: 280px; flex: 0 0 280px; border-right: 1px solid var(--pp-border-medium); padding: 20px; box-sizing: border-box; overflow-y: auto; background: var(--pp-bg-primary);"
        >
          <h1 style="font-size: 18px; margin: 0 0 4px;">Review link</h1>
          <p style="color: var(--pp-text-secondary); font-size: 13px; margin: 0 0 16px;">
            A live, no-install preview of the reviewed page. Click
            <strong>Send feedback</strong> inside the frame to submit.
          </p>
          <p
            data-slot="status"
            style="font-size: 13px; color: var(--pp-text-tertiary); margin: 0 0 16px;"
          ></p>
          <div
            data-slot="notice"
            hidden
            style="font-size: 12px; color: var(--pp-text-tertiary); border: 1px solid var(--pp-border-light); border-radius: 6px; padding: 10px; line-height: 1.5;"
          ></div>
        </aside>
        <main class="pp-review-main" style="flex: 1 1 auto; position: relative;">
          <iframe
            data-slot="frame"
            title="Reviewed page"
            sandbox="allow-forms allow-scripts allow-popups"
            referrerpolicy="no-referrer"
            style="width: 100%; height: 100%; border: 0;"
          ></iframe>
        </main>
      </div>
    </template>
