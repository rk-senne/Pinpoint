# Pinpoint — provider-neutral production stack (single Linux host + Docker).
#
#   cp deploy/.env.production.example deploy/.env.production   # fill in secrets
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d
#
# Only Caddy publishes ports (80/443). Postgres, Redis, the API and the
# dashboard live on the private Compose network. NODE_ENV=production makes
# the API run its strict config preflight (see README "Self-hosting").
#
# Images: pulled from GHCR (published by .github/workflows/ci.yml on main).
# To build locally instead:  docker compose ... up -d --build
# (the `build:` sections below are the fallback; the context is the repo root).

name: pinpoint

x-server-image: &server-image
  image: ${PINPOINT_SERVER_IMAGE:-ghcr.io/rk-senne/pinpoint/server:latest}
  build:
    context: ..
    dockerfile: server/Dockerfile

x-api-env: &api-env
  NODE_ENV: production
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-pinpoint}
  DB_USER: ${DB_USER:-pinpoint}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pinpoint}
      POSTGRES_USER: ${DB_USER:-pinpoint}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pinpoint} -d ${DB_NAME:-pinpoint}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Rate-limit counters + Socket.IO adapter only; no persistence needed.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    # One-shot: applies pending migrations, then exits 0. `api` waits for it.
    <<: *server-image
    depends_on:
      db:
        condition: service_healthy
    # Runs as the schema OWNER (DB_USER, the Postgres superuser of this
    # image) and creates/updates the unprivileged `pinpoint_app` role from
    # DB_APP_PASSWORD (migration 20261125000101). RLS (PP-08) is enforced
    # because the api below connects as that role, never as the owner.
    environment:
      <<: *api-env
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
    command: ["node", "scripts/migrate.cjs"]
    restart: "no"

  api:
    <<: *server-image
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      # PP-08: the API runs as the NOSUPERUSER NOBYPASSRLS `pinpoint_app` role
      # so the Row-Level Security policies apply; the owner credentials above
      # are used only by the one-shot `migrate` service.
      DB_USER: pinpoint_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
      PORT: "3001"
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:?OAUTH_STATE_SECRET is required}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?INTEGRATION_ENCRYPTION_KEY is required}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      # Same origin as the dashboard (Caddy serves both on https://$DOMAIN).
      CORS_ORIGIN: https://${DOMAIN:?DOMAIN is required}
      APP_URL: https://${DOMAIN}
      INTEGRATION_SLACK_CLIENT_ID: ${INTEGRATION_SLACK_CLIENT_ID:-}
      INTEGRATION_SLACK_CLIENT_SECRET: ${INTEGRATION_SLACK_CLIENT_SECRET:-}
      INTEGRATION_SLACK_SCOPES: ${INTEGRATION_SLACK_SCOPES:-}
      INTEGRATION_JIRA_CLIENT_ID: ${INTEGRATION_JIRA_CLIENT_ID:-}
      INTEGRATION_JIRA_CLIENT_SECRET: ${INTEGRATION_JIRA_CLIENT_SECRET:-}
      INTEGRATION_JIRA_SCOPES: ${INTEGRATION_JIRA_SCOPES:-}
      INTEGRATION_LINEAR_CLIENT_ID: ${INTEGRATION_LINEAR_CLIENT_ID:-}
      INTEGRATION_LINEAR_CLIENT_SECRET: ${INTEGRATION_LINEAR_CLIENT_SECRET:-}
      INTEGRATION_LINEAR_SCOPES: ${INTEGRATION_LINEAR_SCOPES:-}
      INTEGRATION_GITHUB_CLIENT_ID: ${INTEGRATION_GITHUB_CLIENT_ID:-}
      INTEGRATION_GITHUB_CLIENT_SECRET: ${INTEGRATION_GITHUB_CLIENT_SECRET:-}
      INTEGRATION_GITHUB_SCOPES: ${INTEGRATION_GITHUB_SCOPES:-}
      INTEGRATION_CLICKUP_CLIENT_ID: ${INTEGRATION_CLICKUP_CLIENT_ID:-}
      INTEGRATION_CLICKUP_CLIENT_SECRET: ${INTEGRATION_CLICKUP_CLIENT_SECRET:-}
      INTEGRATION_CLICKUP_SCOPES: ${INTEGRATION_CLICKUP_SCOPES:-}
      INTEGRATION_ASANA_CLIENT_ID: ${INTEGRATION_ASANA_CLIENT_ID:-}
      INTEGRATION_ASANA_CLIENT_SECRET: ${INTEGRATION_ASANA_CLIENT_SECRET:-}
      INTEGRATION_ASANA_SCOPES: ${INTEGRATION_ASANA_SCOPES:-}
      # One trusted hop: Caddy. Without it every client shares Caddy's IP.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@${DOMAIN}}
      # Screenshot storage. Default (no S3 settings): local disk on the
      # `screenshots` volume - nothing to buy. To use an S3-compatible
      # service (MinIO, Cloudflare R2, Backblaze B2, ...) set the S3_* values
      # (STORAGE_DRIVER then resolves to s3 on its own, or force it).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-}
      LOCAL_STORAGE_DIR: /data/screenshots
      S3_BUCKET: ${S3_BUCKET:-pinpoint}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-annotations/screenshots}
      # Credentials are read from the SDK's standard environment variables.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      DIGEST_ENABLED: ${DIGEST_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OAUTH_CALLBACK_BASE_URL: https://${DOMAIN}
    volumes:
      - screenshots:/data/screenshots
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  dashboard:
    image: ${PINPOINT_DASHBOARD_IMAGE:-ghcr.io/rk-senne/pinpoint/dashboard:latest}
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      # `vite preview` also proxies /api etc. to the API; Caddy routes those
      # paths straight to `api`, so this is only a safety net.
      API_PROXY_TARGET: http://api:3001
      # Extra https origins images may load from (CSP img-src): S3/CDN
      # screenshots and approved avatar/logo hosts. See docs/DEPLOYMENT.md.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      PINPOINT_IMG_ORIGINS: ${PINPOINT_IMG_ORIGINS:-}

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on:
      - api
      - dashboard
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required (Let's Encrypt contact)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates — keep this volume
      - caddy_config:/config

  # --- Optional observability: docker compose ... --profile monitoring up -d
  # $0 stack (docs/MONITORING.md): Prometheus + Alertmanager + Grafana, plus
  # node / postgres / redis exporters and a blackbox prober (TLS expiry and an
  # end-to-end health probe through Caddy). Nothing here publishes a host port
  # except Grafana on 127.0.0.1:3000 (reach it with an SSH tunnel:
  #   ssh -L 3000:127.0.0.1:3000 user@host   ->  http://localhost:3000 ).
  # All images are pinned to exact versions. Config lives in deploy/monitoring/.
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    tmpfs:
      - /tmp
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s' "$$METRICS_TOKEN" > /tmp/metrics_token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d} \
          --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}

  alertmanager:
    image: prom/alertmanager:v0.35.1
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./monitoring/render-alertmanager.sh:/opt/alertmanager/render-alertmanager.sh:ro
      - ./monitoring/alertmanager-entrypoint.sh:/opt/alertmanager/alertmanager-entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    tmpfs:
      - /tmp
    environment:
      # E-mail goes through the SMTP relay the API already uses.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-${ACME_EMAIL}}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-${SMTP_FROM:-no-reply@${DOMAIN}}}
      ALERT_SMTP_REQUIRE_TLS: ${ALERT_SMTP_REQUIRE_TLS:-true}
      ALERT_NOTIFY_INFO: ${ALERT_NOTIFY_INFO:-false}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Optional extra channels (all unset = e-mail only).
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_NTFY_URL: ${ALERT_NTFY_URL:-}
      ALERT_DISCORD_WEBHOOK_URL: ${ALERT_DISCORD_WEBHOOK_URL:-}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      # Dead-man's switch: a Healthchecks.io check that must be pinged every few minutes.
      HEALTHCHECKS_WATCHDOG_URL: ${HEALTHCHECKS_WATCHDOG_URL:-}
    entrypoint: ["/bin/sh", "/opt/alertmanager/alertmanager-entrypoint.sh"]

  node-exporter:
    image: prom/node-exporter:v1.13.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      # backup.sh writes pinpoint_backup_*.prom here (deploy/backup.sh).
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - ${PINPOINT_TEXTFILE_DIR:-./monitoring/textfile}:/textfile:ro

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.21.1
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The unprivileged app role is enough for pg_stat_database / max_connections.
      DATA_SOURCE_NAME: postgresql://pinpoint_app:${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}@db:5432/${DB_NAME:-pinpoint}?sslmode=disable

  redis-exporter:
    image: oliver006/redis_exporter:v1.99.0
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379

  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      - caddy
    environment:
      DOMAIN: ${DOMAIN}
      BLACKBOX_TEMPLATE: /opt/blackbox/blackbox.tmpl.yml
    volumes:
      - ./monitoring/blackbox.tmpl.yml:/opt/blackbox/blackbox.tmpl.yml:ro
      - ./monitoring/blackbox-entrypoint.sh:/opt/blackbox/blackbox-entrypoint.sh:ro
    tmpfs:
      - /tmp
    entrypoint: ["/bin/sh", "/opt/blackbox/blackbox-entrypoint.sh"]

  grafana:
    image: grafana/grafana:13.3.2
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Defaults to a derived-from-secrets value so a forgotten setting is never "admin".
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-${METRICS_TOKEN}}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000/
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  db_data:
  screenshots: # local-disk screenshots (STORAGE_DRIVER=local) - back this up
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:
