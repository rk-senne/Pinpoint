# Prometheus config for the `monitoring` profile of deploy/docker-compose.prod.yml.
# The API requires METRICS_TOKEN on an exposed deployment; the compose file
# writes it to /tmp/metrics_token at start-up.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: pinpoint-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["api:3001"]
