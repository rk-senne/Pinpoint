# Pinpoint containerised development stack.
#
# Brings up Postgres, runs all pending migrations to completion, then
# starts the API server and Dashboard. Per design key decision #14
# (Docker Compose & CI) and Requirement 29:
#
#   docker compose up
#
# starts the whole stack. The Dashboard is reachable at http://localhost:4173
# and the API at http://localhost:3001.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pinpoint}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` is the canonical readiness probe per Postgres docs.
      # Pin user/db so it doesn't fall back to the image default `postgres`
      # database, which may not exist.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pinpoint}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    # One-shot migration runner. Reuses the server image so we get the
    # exact same node, knex, and migration files as the API.
    build:
      context: .
      dockerfile: server/Dockerfile
    image: pinpoint-server:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pinpoint}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      NODE_ENV: development
    command: ["npm", "run", "migrate"]
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 3

  mailpit:
    # Local SMTP sink so dev can observe outgoing mail (verification,
    # password reset, notifications) without a real mail provider.
    # SMTP on 1025 (what `api` points SMTP_HOST/SMTP_PORT at by default),
    # web UI on 8025 → http://localhost:8025.
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: pinpoint-server:latest
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pinpoint}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      PORT: "3001"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4173}
      APP_URL: ${APP_URL:-http://localhost:4173}
      NODE_ENV: development
      # Local Compose is plain HTTP, so the session cookie can't carry the
      # Secure flag or non-Chrome browsers drop it. The boot preflight
      # refuses COOKIE_INSECURE on any exposed/production deployment.
      COOKIE_INSECURE: ${COOKIE_INSECURE:-true}
      # Asserts this is a loopback-only local stack (ports below are bound
      # to 127.0.0.1), so the strict exposed-deployment preflight doesn't
      # reject the dev defaults just because the container binds 0.0.0.0.
      # Remove this (and set real secrets) before exposing the stack.
      PINPOINT_LOCAL_DEV: "1"
      # Inside the container the API must listen on all interfaces for the
      # published port to reach it.
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
      # Point outbound mail at the local mailpit sink (see the `mailpit`
      # service below). `config.ts` reads exactly these names (SMTP_HOST /
      # SMTP_PORT); the catcher accepts unauthenticated plaintext SMTP.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    ports:
      - "127.0.0.1:3001:3001"

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    depends_on:
      api:
        condition: service_started
    environment:
      # `vite preview` proxies /api, /socket.io, /widget and review-link
      # frames to the API so dashboard + API share one origin (first-party
      # cookies, no CORS). See dashboard/vite.config.ts.
      API_PROXY_TARGET: http://api:3001
    ports:
      - "127.0.0.1:4173:4173"

  # --- Optional local observability -------------------------------------
  # Behind the `monitoring` profile so a plain `docker compose up` does NOT
  # start them. Enable with:
  #
  #   docker compose --profile monitoring up
  #
  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  db_data:
  grafana_data:
